<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoPlus - Gestión de Productos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-cpu-fill me-2"></i>TecnoPlus | Inventario de Productos
            </span>
        </div>
    </nav>

    <div class="container">
        <!-- Alerta de notificaciones -->
        <div id="alerta-container"></div>

        <div class="row g-4">
            <!-- Columna Izquierda: Formulario Registrar / Editar -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold" id="form-titulo">
                        <i class="bi bi-plus-circle me-1 text-primary"></i>Registrar Producto
                    </div>
                    <div class="card-body">
                        <form id="form-producto">
                            <input type="hidden" id="producto-id">

                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre del Producto</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej. Laptop HP" required>
                            </div>

                            <div class="mb-3">
                                <label for="categoria" class="form-label">Categoría</label>
                                <select class="form-select" id="categoria" required>
                                    <option value="">Seleccione una categoría...</option>
                                    <option value="Computadoras">Computadoras</option>
                                    <option value="Accesorios">Accesorios</option>
                                    <option value="Monitores">Monitores</option>
                                    <option value="Componentes">Componentes</option>
                                    <option value="Redes">Redes</option>
                                </select>
                            </div>

                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label for="precio" class="form-label">Precio ($)</label>
                                    <input type="number" step="0.01" min="0.01" class="form-control" id="precio" placeholder="0.00" required>
                                </div>
                                <div class="col-6 mb-3">
                                    <label for="stock" class="form-label">Stock</label>
                                    <input type="number" step="1" min="0" class="form-control" id="stock" placeholder="0" required>
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary" id="btn-guardar">
                                    <i class="bi bi-save me-1"></i>Guardar Producto
                                </button>
                                <button type="button" class="btn btn-outline-secondary d-none" id="btn-cancelar">
                                    Cancelar Edición
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Tabla de Productos -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <span class="fw-bold"><i class="bi bi-list-ul me-1 text-primary"></i>Listado de Productos</span>
                        <input type="text" id="buscador" class="form-control form-control-sm w-auto" placeholder="Buscar por nombre o categoría...">
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Producto</th>
                                        <th>Categoría</th>
                                        <th>Precio</th>
                                        <th>Stock</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-productos">
                                    <tr>
                                        <td colspan="5" class="text-center py-4 text-muted">Cargando productos...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS y Lógica del Frontend -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
